apply plugin: rootProject.modernTarget ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'dev.mixinmcp.decompile'

def pins = rootProject.targetPins
def dependencyConfiguration = rootProject.modernTarget ? 'implementation' : 'modImplementation'
dependencies {
    include(rootProject.crunchDependency) { transitive = false }
    minecraft "com.mojang:minecraft:${pins.minecraft_version}"
    if (!rootProject.modernTarget) mappings loom.officialMojangMappings()
    add(dependencyConfiguration, "net.fabricmc:fabric-loader:${pins.loader_version}")
    add(dependencyConfiguration, "net.fabricmc.fabric-api:fabric-api:${pins.fabric_api_version}")
    add(dependencyConfiguration, "net.fabricmc:fabric-language-kotlin:${pins.fabric_kotlin_version}")
    add(dependencyConfiguration, "me.fzzyhmstrs:fzzy_config:${pins.fzzy_config_version}")
}
loom {
    runs.configureEach { runDir "run/${pins.minecraft_version}" }
}
