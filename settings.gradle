pluginManagement {
    def target = providers.gradleProperty('coinageTarget').getOrElse('1.21.1')
    def profile = new File(settingsDir, "targets/${target}.properties")
    if (!profile.isFile()) throw new GradleException("Unknown Minecraft target ${target}")
    def pins = new Properties()
    profile.withReader('UTF-8') { pins.load(it) }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.jetbrains.kotlin.jvm') useVersion(pins.kotlin_version)
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.muon.rip/releases' }
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'coinage'
include 'fabric', 'neoforge'
