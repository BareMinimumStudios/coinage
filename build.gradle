plugins {
    id 'base'
    id 'com.gradleup.shadow' version '9.3.1' apply false
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'dev.mixinmcp.decompile' version '1.5.0' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'com.gradleup.shadow'
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url = 'https://jitpack.io' } }
            filter { includeModule('com.github.boxbeam', 'Crunch') }
        }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.fzzyhmstrs.me/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    }
    base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
        withSourcesJar()
    }
    kotlin { jvmToolchain(21) }
    sourceSets {
        main {
            java.srcDir rootProject.file('src/main/java')
            kotlin.srcDir rootProject.file('src/main/kotlin')
            resources.srcDir rootProject.file('src/main/resources')
        }
        if (project.name == 'fabric') test { kotlin.srcDir rootProject.file('src/test/kotlin') }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
    configurations {
        expressionEngine { transitive = false }
        implementation.extendsFrom(expressionEngine)
    }
    dependencies {
        // boxbeam/Crunch rewrite at 0c7d52fc1926960842d11d196832b058580a00b4.
        expressionEngine 'com.github.boxbeam:Crunch:0c7d52fc19'
        testImplementation platform('org.junit:junit-bom:5.14.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
        inputs.property 'version', project.version
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand version: project.version
        }
    }
    tasks.named('shadowJar') {
        configurations = [project.configurations.expressionEngine]
        relocate 'redempt.crunch', 'net.bms.numismatic_overhaul.internal.crunch'
        exclude 'META-INF/maven/**'
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('LICENSE-Crunch'))
    }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
tasks.named('clean') { dependsOn ':fabric:clean', ':neoforge:clean' }
