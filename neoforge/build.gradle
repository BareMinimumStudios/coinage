plugins { id 'net.neoforged.moddev' }
def pins = rootProject.targetPins
neoForge {
    version = pins.neoforge_version
    runs {
        configureEach { gameDirectory = project.file("run/${pins.minecraft_version}") }
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { coinage { sourceSet sourceSets.main } }
}
dependencies {
    implementation(pins.fzzy_neoforge_coordinate) {
        // Fzzy marks KLF optional; Kotlin For Forge supplies our Kotlin runtime.
        exclude group: 'dev.nyon', module: 'KotlinLangForge'
    }
    implementation "thedarkcolour:kotlinforforge-neoforge:${pins.kotlin_for_forge_version}"
}
tasks.named('jar') { archiveClassifier.set('unshaded') }
tasks.named('shadowJar') { archiveClassifier.set('') }
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }
