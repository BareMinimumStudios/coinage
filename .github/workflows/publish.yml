name: Publish Coinage

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and stage release files without publishing
        type: boolean
        default: true
      destination:
        description: Where to publish
        type: choice
        default: all
        options: [all, modrinth, curseforge, github]
      minecraft:
        description: Minecraft version for Modrinth and CurseForge
        type: choice
        default: all
        options: [all, '1.21.1', '26.3']
      loader:
        description: Mod loader for Modrinth and CurseForge
        type: choice
        default: all
        options: [all, fabric, neoforge]

permissions:
  contents: read

concurrency:
  group: coinage-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  MODRINTH_PROJECT_ID: '8nyluFIT'
  CURSEFORGE_PROJECT_ID: '1834493'

jobs:
  metadata:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release metadata
        id: release
        env:
          PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            python3 scripts/release.py --publish
          else
            python3 scripts/release.py
          fi

  build:
    name: Build ${{ matrix.version }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/wrapper/gradle-wrapper.properties
            targets/*.properties
      - name: Build, verify, and stage the release JAR
        env:
          MINECRAFT: ${{ matrix.target }}
          LOADER: ${{ matrix.loader }}
        run: |
          bash scripts/build.sh "$LOADER" "$MINECRAFT"
          python3 scripts/release.py --stage "$MINECRAFT" "$LOADER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ matrix.loader }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  modrinth-curseforge:
    name: Publish ${{ matrix.version }} to Modrinth and CurseForge
    needs: [metadata, build]
    if: github.event_name == 'push' || (!inputs.dry_run && inputs.destination != 'github')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - name: Download release files
        if: github.event_name == 'push' || ((inputs.minecraft == 'all' || inputs.minecraft == matrix.target) && (inputs.loader == 'all' || inputs.loader == matrix.loader))
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}-${{ matrix.loader }}
          path: build/release
      - name: Check publishing credentials
        if: github.event_name == 'push' || ((inputs.minecraft == 'all' || inputs.minecraft == matrix.target) && (inputs.loader == 'all' || inputs.loader == matrix.loader))
        env:
          DESTINATION: ${{ inputs.destination || 'all' }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ "$DESTINATION" != curseforge && -z "$MODRINTH_TOKEN" ]]; then
            echo "::error::Missing MODRINTH_TOKEN Actions secret."
            exit 1
          fi
          if [[ "$DESTINATION" != modrinth && -z "$CURSEFORGE_TOKEN" ]]; then
            echo "::error::Missing CURSEFORGE_TOKEN Actions secret."
            exit 1
          fi
      - name: Publish to Modrinth and/or CurseForge
        if: github.event_name == 'push' || ((inputs.minecraft == 'all' || inputs.minecraft == matrix.target) && (inputs.loader == 'all' || inputs.loader == matrix.loader))
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: ${{ (github.event_name == 'push' || inputs.destination != 'curseforge') && env.MODRINTH_PROJECT_ID || '${undefined}' }}
          modrinth-token: ${{ (github.event_name == 'push' || inputs.destination != 'curseforge') && secrets.MODRINTH_TOKEN || '${undefined}' }}
          curseforge-id: ${{ (github.event_name == 'push' || inputs.destination != 'modrinth') && env.CURSEFORGE_PROJECT_ID || '${undefined}' }}
          curseforge-token: ${{ (github.event_name == 'push' || inputs.destination != 'modrinth') && secrets.CURSEFORGE_TOKEN || '${undefined}' }}
          files: build/release/${{ matrix.jar }}
          name: ${{ matrix.version }}
          version: ${{ matrix.version }}
          version-type: ${{ needs.metadata.outputs.channel }}
          changelog-file: build/release/RELEASE-NOTES.md
          loaders: ${{ matrix.loader }}
          environment: client | server
          game-versions: ${{ matrix.target }}
          game-version-filter: none
          java: ${{ matrix.java }}
          dependencies: |
            ${{ matrix.loader == 'fabric' && 'fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}' || 'kotlinforforge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}' }}
            ${{ matrix.loader == 'fabric' && 'fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}' || '' }}
            fzzy_config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
          retry-attempts: 3
          fail-mode: fail

  github-release:
    name: Publish GitHub Release
    needs: [metadata, build]
    if: github.event_name == 'push' || (!inputs.dry_run && (inputs.destination == 'all' || inputs.destination == 'github'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: build/release
      - name: Publish the release with all four JARs
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.metadata.outputs.tag }}
          github-commitish: ${{ github.sha }}
          github-prerelease: ${{ needs.metadata.outputs.channel != 'release' }}
          files: build/release/release-*/coinage-*.jar
          name: Coinage ${{ needs.metadata.outputs.version }}
          version: ${{ needs.metadata.outputs.version }}
          version-type: ${{ needs.metadata.outputs.channel }}
          changelog-file: build/release/release-1.21.1-fabric/RELEASE-NOTES.md
          retry-attempts: 3
          fail-mode: fail
